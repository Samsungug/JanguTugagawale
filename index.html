async function backendFetch(input,options={}){
if(navigator.onLine===false)throw new Error('You are offline. Connect to the internet and try again.');
const controller=new AbortController(),signal=options.signal||(typeof input==='object'?input.signal:null),abort=()=>controller.abort();
if(signal?.aborted)abort();else signal?.addEventListener('abort',abort,{once:true});
const address=typeof input==='string'?input:input?.url||String(input);
const wait=address.includes('/rpc/jtg_login_identity')?12000:address.includes('/auth/v1/token')?20000:30000;
const timeout=setTimeout(abort,wait);
try{return await fetch(input,{...options,signal:controller.signal});}catch(error){if(controller.signal.aborted)throw new Error('The connection timed out. Please try again.');throw error;}finally{clearTimeout(timeout);signal?.removeEventListener('abort',abort);}
}

async function handleAuth(e){
e.preventDefault();if(authBusy)return;const f=e.target,d=new FormData(f),mode=authMode,button=f.querySelector('button[type="submit"]'),error=document.getElementById('authError'),originalLabel=button.innerHTML;
const fail=m=>{const target=document.getElementById('authError');if(target){target.textContent=m;target.classList.remove('hidden');}else toast(m);};
authBusy=true;f.setAttribute('aria-busy','true');button.disabled=true;button.textContent=mode==='login'?'Logging in…':mode==='signup'||mode==='reset'?'Sending code…':'Saving account…';error.classList.add('hidden');

if(mode==='login'){
const loginGeneration=authGeneration;
const phone=normalize(d.get('phone'));if(!/^0[37]\d{8}$/.test(phone))throw new Error('Enter a valid Ugandan mobile number.');
const tokens=await authenticateAccount(phone,String(d.get('password')),d.get('email'));if(!tokens?.access_token||!tokens?.refresh_token)throw new Error('Login could not be completed. Please try again.');
if(syncTask)await syncTask;if(loginGeneration!==authGeneration)throw new Error('This sign-in was cancelled by a newer account action. Please try again.');
authGeneration++;const installedGeneration=authGeneration;session=null;clearFinancialState();connectionNotice();
const {data,error:loginError}=await cloud.auth.setSession({access_token:tokens.access_token,refresh_token:tokens.refresh_token});
if(installedGeneration!==authGeneration){await cloud.auth.signOut({scope:'local'});throw new Error('This sign-in was cancelled. Please try again.');}
if(loginError)throw loginError;if(!data.session)throw new Error('Login could not be completed. Please try again.');
cloudSession=data.session;knownMemberId=tokens.pending_setup===true?null:data.session.user.id;recoveryVerified=false;route='home';rememberLoginPhone(phone);if(!tokens.pending_setup){signupDraft=null;storeDraft();}
history.replaceState(null,'',location.pathname+location.search);if(await syncCloud()){if(session){modal.close();route=session.admin?'overview':'home';history.replaceState(null,'',location.pathname+location.search+'#'+(session.admin?'admin/overview':'home'));render();}}return;
}
if(mode==='reset'){const email=String(d.get('email')).trim().toLowerCase();signupDraft={email,type:'reset',stage:'details'};storeDraft();await sendEmailCode(signupDraft);signupDraft.stage='verify';storeDraft();recoveryVerified=false;authMode='reset-verify';renderAuth();toast('Recovery code requested. Check your inbox and spam folder.');return;}
if(mode==='reset-verify'){
if(d.get('password')!==d.get('confirm'))throw new Error('Your passwords do not match.');
if(!recoveryVerified){if(!signupDraft?.email)throw new Error('Request a recovery code again.');const {data,error:verifyError}=await cloud.auth.verifyOtp({email:signupDraft.email,token:String(d.get('otp')),type:'recovery'});if(verifyError)throw verifyError;if(!data.session)throw new Error('Recovery could not be verified. Please request a new code.');authGeneration++;cloudSession=data.session;recoveryVerified=true;session=null;clearFinancialState();connectionNotice();}
const {error:updateError}=await cloud.auth.updateUser({password:String(d.get('password'))});if(updateError)throw updateError;
const {error:outError}=await cloud.auth.signOut({scope:'local'});if(outError)throw outError;authGeneration++;cloudSession=null;session=null;clearFinancialState();connectionNotice();recoveryVerified=false;signupDraft=null;storeDraft();authMode='login';renderAuth();toast('Password updated. Log in with your phone and new password.');return;
}
if(mode==='signup'||mode==='complete'){
const phone=normalize(d.get('phone')),name=String(d.get('name')||'').trim(),referral=incomingReferral||String(d.get('referral')||'').trim().toUpperCase();
if(!/^0[37]\d{8}$/.test(phone))throw new Error('Enter a valid Ugandan mobile number.');if(!name||name.length>80)throw new Error('Enter your registered name, up to 80 characters.');if(!d.get('adult'))throw new Error('You must be 18 years or older.');if(referral)await resolveInvitation(referral);
const email=mode==='complete'?cloudSession?.user?.email:String(d.get('email')||'').trim().toLowerCase();if(!email)throw new Error('Start registration again to verify your email.');
if(mode==='signup'&&cloudSession){const {error:outError}=await cloud.auth.signOut({scope:'local'});if(outError)throw outError;authGeneration++;cloudSession=null;session=null;clearFinancialState();connectionNotice();}
signupDraft={phone,name,referral,adult:true,email,type:'signup',stage:mode==='complete'?'complete':'details'};storeDraft();rememberLoginPhone(phone);
if(mode==='signup'){await sendEmailCode(signupDraft);signupDraft.stage='verify';storeDraft();authMode='verify';renderAuth();toast('Verification code requested. Check your inbox and spam folder.');return;}
}
if(mode==='verify'||mode==='complete'){

if(!cloudSession?.user?.email_confirmed_at||cloudSession.user.email?.toLowerCase()!==signupDraft.email.toLowerCase())throw new Error('Verify your registered email before continuing.');
const {error:passwordError}=await cloud.auth.updateUser({password:String(d.get('password')),data:{username:signupDraft.name,jtg_phone:signupDraft.phone,jtg_referral:signupDraft.referral||'',jtg_adult:signupDraft.adult===true}});

function paymentPage(id){const pack=packages.find(p=>p.id===id),u=current();if(!pack||!u)return investPage();return `${sectionHead('PACKAGE PAYMENT','Invest in '+esc(pack.name),'Activation requires admin payment approval.',btn(icon('arrow-left')+' Back to packages','back-packages','border border-slate-200 bg-card text-white'))}<div class="grid items-start gap-6 lg:grid-cols-[1.4fr_1fr]"><section class="rounded-2xl border border-slate-200 bg-card p-6 sm:p-8"><form id="paymentForm" data-package-id="${id}" class="space-y-5"><div class="flex flex-wrap justify-between gap-3 rounded-xl bg-slate-50 p-4"><span class="text-sm text-muted">Package amount</span><strong>UGX ${money(pack.price)}</strong></div><fieldset><legend class="mb-3 text-sm font-semibold">Choose payment network</legend><div class="grid grid-cols-2 gap-3">${['MTN','Airtel'].map(n=>`<label class="flex min-h-14 items-center gap-3 rounded-xl border border-slate-200 p-4"><input type="radio" name="network" value="${n}" ${n==='MTN'?'checked':''} class="accent-blue"><span class="text-sm font-bold">${n}</span><span class="ml-auto h-3 w-3 rounded-full ${n==='MTN'?'bg-yellow-400':'bg-red-500'}"></span></label>`).join('')}</div></fieldset><div class="rounded-xl bg-ink p-5"><p class="text-[10px] uppercase tracking-wider text-muted">Merchant reference</p><p id="merchant" class="mt-2 font-display text-2xl font-bold">05911275</p><p id="merchantNetwork" class="mt-2 text-xs text-muted">Pay using MTN</p></div>${field('Sent from phone','sender','tel','07XXXXXXXX','required maxlength="32" value="'+esc(u.phone)+'" autocomplete="tel"')}${field('Payment reference / proof','proof','text','Transaction reference','required maxlength="120"')}<p class="text-xs leading-relaxed text-muted">Submit your details after paying. No earnings or bonuses are credited before admin approval.</p><p id="paymentError" role="alert" class="hidden text-sm text-red-600"></p><button type="submit" class="min-h-12 w-full rounded-lg bg-blue text-sm font-bold function bindPaymentForm(id){const f=document.getElementById('paymentForm');if(!f)return;f.addEventListener('change',e=>{if(e.target.name==='network'){document.getElementById('merchant').textContent=e.target.value==='MTN'?'05911275':'7283255';document.getElementById('merchantNetwork').textContent='Pay using '+e.target.value;}});f.addEventListener('submit',async e=>{e.preventDefault();if(f.dataset.busy==='true')return;const d=new FormData(f),sender=normalize(d.get('sender')),proof=String(d.get('proof')||'').trim(),err=document.getElementById('paymentError'),submit=f.querySelector('button[type="submit"]');const fail=m=>{if(err?.isConnected){err.textContent=m;err.classList.remove('hidden');}else toast(m);};if(!guard()||session.admin)return fail('Reconnect and verify your member account before submitting.');if(!/^0[37]\d{8}$/.test(sender))return fail('Enter a valid Ugandan sender phone.');if(!proof)return fail('Enter the transaction reference from your payment.');err.classList.add('hidden');f.dataset.busy='true';f.setAttribute('aria-busy','true');submit.disabled=true;submit.textContent='Submitting…';try{await rpcCloud('jtg_request_payment',{p_package_id:id,p_network:d.get('network'),p_sender:sender,p_proof:proof});viewDrafts.delete('paymentForm:'+id);f.reset();selectedPackageId=null;route='products';history.pushState(null,'',location.pathname+location.search+'#products');const refreshed=await syncCloud();render();toast(refreshed?'Payment saved. Waiting for admin approval.':'Payment saved. Reconnect to load its latest status; do not submit it again.');}catch(error){fail(cloudMessage(error));}finally{delete f.dataset.busy;f.removeAttribute('aria-busy');if(submit.isConnected){submit.disabled=false;submit.textContent='I HAVE PAID';}}});}

function withdrawalStatusNote(w){return w.status==='Approved'?`UGX ${money(w.amount)} deducted once from Daily Earnings. Net payout: UGX ${money(w.net)}.`:w.status==='Rejected'?'Rejected. Reservation released; no deduction.':`UGX ${money(w.amount)} reserved in Daily Earnings. Charge: ${w.taxPercent}%. Net to Pay: UGX ${money(w.net)}. Capital is excluded.`;}
function withdrawPage(u){const records=db.withdrawals.filter(w=>w.userId===u.id),available=balance(u.id),remaining=Number(withdrawalLimits?.remainingToday||0),availableNet=netAfterCharge(available),canRequest=netAfterCharge(Math.floor(available))>=minimumWithdrawal&&remaining>0;return `${sectionHead('DAILY EARNINGS ONLY','Withdraw earnings','15% charge · Only when Net to Pay is at least UGX 7,000')}<div class="grid items-start gap-6 lg:grid-cols-[1.4fr_1fr]"><section class="rounded-2xl border border-slate-200 bg-card p-6 sm:p-8"><h2 class="font-display text-lg font-bold">New withdrawal request</h2><section id="withdrawBalanceNote" class="my-6 rounded-xl border border-blue-100 bg-ink p-5"><p class="text-xs text-muted">Daily Earnings Balance</p><p class="mt-2 text-3xl font-extrabold">UGX ${money(accountBalance(u.id))}</p><p class="mt-4 text-sm font-semibold text-blue">Available Gross: UGX ${money(available)}</p><p class="mt-3 text-sm font-bold text-emerald-300">Available Net after 15% charge: UGX ${money(availableNet)}</p>${earningsBreakdown(wallet(u.id).dailyGross,available,'Available earnings summary')}<p class="mt-3 text-xs leading-relaxed text-muted">Pending reservations: UGX ${money(pendingWithdrawals(u.id))}. Only Daily Earnings and credited referral bonuses are withdrawable. Capital is never available here.</p></section>${netAfterCharge(Math.floor(available))<minimumWithdrawal?'<p role="alert" class="mb-5 rounded-xl border border-red-100 bg-red-50 p-4 text-sm font-bold text-red-700">Minimum Net to Pay is 7,000 UGX after the 15% charge. You need at least 8,236 UGX in available gross earnings.</p>':''}<div id="withdrawLimitNote" class="mb-6 rounded-xl bg-blue-50 p-4 text-sm"><p class="font-bold">Requests today: ${Number(withdrawalLimits?.submittedToday||0)} / ${dailyWithdrawalLimit}</p><p class="mt-2 text-xs leading-relaxed text-muted">${remaining>0?remaining+' request(s) remaining today.':'Daily limit reached.'} Resets at midnight Uganda time. All submitted requests count.</p></div><form id="withdrawForm" class="space-y-5">${field('Gross amount to withdraw (UGX)','amount','number','Enter at least 8,236 for 7,000 Net','required min="8236" max="'+Math.max(minimumGrossWithdrawal,Math.floor(available))+'" step="1" inputmode="numeric" aria-describedby="withdrawBalanceNote withdrawLimitNote withdrawMinimumNote"')}<p id="withdrawMinimumNote" class="text-xs leading-relaxed text-muted">Only submit when Net to Pay is at least UGX 7,000. Charge = Gross Amount × 15%. Net = Gross Amount × 85%. Minimum whole-UGX gross request: UGX 8,236.</p><div aria-live="polite" aria-atomic="true" class="grid grid-cols-3 gap-2 rounded-xl bg-slate-50 p-4"><div><p class="text-[10px] text-muted">Requested · UGX</p><p id="requestedVal" class="mt-2 break-all text-sm font-bold">0</p></div><div><p class="text-[10px] text-amber-300">Charge · 15%</p><p id="taxVal" class="mt-2 break-all text-sm font-bold text-amber-300">0</p></div><div><p class="text-[10px] text-blue">Net to Pay · UGX</p><p id="netVal" class="mt-2 break-all text-sm font-bold text-blue">0</p></div></div><fieldset><legend class="mb-3 text-sm font-medium">Receive via</legend><div class="grid grid-cols-2 gap-3">${['MTN','Airtel'].map(n=>`<label class="flex min-h-12 items-center gap-3 rounded-xl border border-slate-200 p-4 text-sm font-semibold"><input name="network" type="radio" value="${n}" ${n==='MTN'?'checked':''} class="accent-blue">${n}</label>`).join('')}</div></fieldset>${field('Mobile money phone','phone','tel','07XXXXXXXX','required value="'+esc(u.phone)+'" autocomplete="tel" maxlength="32"')}${field('Registered mobile money name','name','text','Full name','required value="'+esc(u.name)+'" autocomplete="name" maxlength="80"')}<p class="text-xs leading-relaxed text-muted">The full request is reserved. Approval deducts it once from Daily Earnings: 15% charge + 85% net payout. Capital stays untouched.</p><p id="withdrawError" role="alert" class="hidden text-sm text-red-600"></p><button type="submit" ${canRequest?'':'disabled'} class="min-h-12 w-full rounded-lg bg-blue text-sm font-bold text-white hover:bg-blue-700">Submit request ${icon('arrow-right','ml-3')}</button></form></section><aside class="rounded-2xl border border-slate-200 bg-card p-6"><h2 class="font-display text-lg font-bold">Charge & payout example</h2><dl class="mt-5 space-y-4 text-sm"><div class="flex justify-between gap-3"><dt class="text-muted">Request</dt><dd>UGX 100,000</dd></div><div class="flex justify-between gap-3"><dt class="text-amber-300">Charge · 15%</dt><dd class="text-amber-300">UGX 15,000</dd></div><div class="flex justify-between gap-3 border-t border-slate-200 pt-4"><dt class="font-bold text-blue">Net to Pay</dt><dd class="font-bold text-blue">UGX 85,000</dd></div></dl><p class="mt-5 text-xs leading-relaxed text-muted">The 15% charge is applied to your requested amount. Net to Pay must be at least UGX 7,000. Pending withdrawals keep the 15% charge; reviewed payouts retain their recorded breakdown.</p></aside></div><section class="mt-8"><div class="mb-5 flex flex-wrap items-center justify-between gap-3"><h2 class="font-display text-lg font-bold">Withdrawal history</h2>${btn('Refresh','refresh','border border-slate-200 bg-card text-white')}</div>${records.length?`<div class="grid gap-5 md:grid-cols-2">${records.slice().reverse().map(w=>`<article class="rounded-2xl border border-slate-200 bg-card p-5"><div class="flex flex-wrap justify-between gap-3"><strong class="text-sm">${esc(w.network)} · ${esc(w.phone)}</strong>${pill(w.status)}</div>${taxBoxes(w)}<p class="rounded-lg bg-slate-50 p-3 text-xs leading-relaxed text-muted">${withdrawalStatusNote(w)}</p><p class="mt-4 text-xs text-muted">${esc(w.name)} · ${date(w.submitted)}</p>${w.reviewed?`<p class="mt-2 text-xs text-muted">${w.status} ${date(w.reviewed)}</p>`:''}</article>`).join('')}</div>`:empty('No withdrawal requests','Requests and their updated breakdown appear here.')}</section>`;}
function bindWithdraw(){const f=document.getElementById('withdrawForm');if(!f)return;const submit=f.querySelector('[type="submit"]');const update=()=>{const a=Math.max(0,Number(f.elements.amount.value)||0),net=netAfterCharge(a);document.getElementById('requestedVal').textContent=money(a);document.getElementById('taxVal').textContent=money(chargeFor(a));document.getElementById('netVal').textContent=money(net);submit.disabled=f.dataset.busy==='true'||!Number.isSafeInteger(a)||net<minimumWithdrawal||a>balance(current()?.id)||!withdrawalLimits?.remainingToday;};f.elements.amount.addEventListener('input',update);update();f.addEventListener('submit',async e=>{e.preventDefault();if(f.dataset.busy==='true')return;const d=new FormData(f),amount=Number(d.get('amount')),phone=normalize(d.get('phone')),name=String(d.get('name')||'').trim(),error=document.getElementById('withdrawError');const fail=m=>{if(error?.isConnected){error.textContent=m;error.classList.remove('hidden');}else toast(m);};if(!guard()||session.admin)return fail('Reconnect to verify your account.');const u=current();if(!Number.isSafeInteger(amount)||amount<minimumGrossWithdrawal||netAfterCharge(amount)<minimumWithdrawal||netAfterCharge(Math.floor(balance(u.id)))<minimumWithdrawal)return fail('Minimum Net to Pay is 7,000 UGX after the 15% charge. Request at least 8,236 UGX.');if(!withdrawalLimits||withdrawalLimits.remainingToday<=0)return fail('Only two requests are allowed per Uganda day.');if(amount>balance(u.id))return fail('Amount exceeds available Daily Earnings. Capital is not withdrawable.');if(!/^0[37]\d{8}$/.test(phone)||!name)return fail('Enter valid mobile money details.');f.dataset.busy='true';f.setAttribute('aria-busy','true');submit.disabled=true;submit.textContent='Submitting…';error.classList.add('hidden');try{await rpcCloud('jtg_request_withdrawal',{p_amount:amount,p_network:d.get('network'),p_phone:phone,p_name:name});viewDrafts.delete('withdrawForm:');f.reset();const refreshed=await syncCloud();if(guard())render();toast(refreshed?'Withdrawal saved. 15% charge; eligible net payout verified.':'Request saved. Reconnect to see its status; do not submit it again.');}catch(err){fail(cloudMessage(err));}finally{delete f.dataset.busy;f.removeAttribute('aria-busy');if(submit.isConnected){submit.textContent='Submit request';update();}}});}

cloud.auth.onAuthStateChange((event,active)=>{if(event==='INITIAL_SESSION')return;const eventGeneration=authGeneration;setTimeout(async()=>{
if(authBusy||eventGeneration!==authGeneration)return;
try{
if(event==='PASSWORD_RECOVERY'&&active){authGeneration++;cloudSession=active;recoveryVerified=true;session=null;clearFinancialState();connectionNotice();modal.close();authMode='reset-verify';signupDraft={email:active.user.email,type:'reset'};storeDraft();renderAuth();return;}
if(['SIGNED_OUT','SIGNED_IN','TOKEN_REFRESHED','USER_UPDATED'].includes(event)){
if(modal.open||recoveryVerified)return;
// Never navigate to login just because a queued event carried a null session.
// syncCloud reads the current SDK state, recovers a saved session if needed,

await syncCloud();
}
}catch(error){if(eventGeneration!==authGeneration)return;const message=cloudMessage(error);if(cloudSession||session&&financialReady){authUncertain=true;connectionNotice(message);if(!session||!financialReady)renderConnectionError(message);}else toast(message);}
},0);});
