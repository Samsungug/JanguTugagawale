async function backendFetch(input,options={}){
if(navigator.onLine===false)throw new Error('You are offline. Connect to the internet and try again.');
const controller=new AbortController(),signal=options.signal||(typeof input==='object'?input.signal:null),abort=()=>controller.abort();
if(signal?.aborted)abort();else signal?.addEventListener('abort',abort,{once:true});
const address=typeof input==='string'?input:input?.url||String(input);
const wait=address.includes('/rpc/jtg_login_identity')?12000:address.includes('/auth/v1/token')?20000:30000;
const timeout=setTimeout(abort,wait);
try{return await fetch(input,{...options,signal:controller.signal});}catch(error){if(controller.signal.aborted)throw new Error('The connection timed out. Please try again.');throw error;}finally{clearTimeout(timeout);signal?.removeEventListener('abort',abort);}
}

async function rpcCloud(name,params={}){const {data,error}=await cloud.rpc(name,params);if(error)throw error;return data;}
async function invokeCloud(name,body,{publicAccess=false}={}){const client=publicAccess?publicCloud:cloud;const {data,error}=await client.functions.invoke(name,{body});if(error){let message=error.message,code=error.code||'',status=error.context?.status||0;if((window.supabase.FunctionsHttpError&&error instanceof window.supabase.FunctionsHttpError)||(error.context&&typeof error.context.text==='function')){try{const text=await error.context.text();try{const response=JSON.parse(text);message=response.error||text;code=response.code||code;}catch{message=text||message;}}catch{}}throw Object.assign(new Error(message||'Unable to connect. Please try again.'),{code,status});}if(data?.error)throw Object.assign(new Error(data.error),{code:data.code||''});return data;}
// An email fallback talks directly to Auth if phone-login services cannot be reached.
// It never looks up or exposes another member's email, and checks the authenticated phone.
async function loginWithEmail(phone,password,email){
const client=window.supabase.createClient(BACKEND_URL,BACKEND_ANON_KEY,{global:{fetch:backendFetch},auth:{storageKey:'jtg-direct-login',persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const {data,error}=await client.auth.signInWithPassword({email:String(email).trim().toLowerCase(),password});if(error)throw error;if(!data.session)throw new Error('Login could not be completed. Please try again.');
try{
const {data:member,error:memberError}=await client.from('jtg_member_accounts').select('user_id,phone,banned,consent_at,adult_confirmed').eq('user_id',data.session.user.id).maybeSingle();if(memberError)throw memberError;
if(member&&normalize(member.phone)!==phone)throw new Error('This registered email belongs to a different phone number. Enter the phone number used to create this account.');
if(member?.banned)throw new Error('You have been banned contact admin');
if(member&&(!member.consent_at||!member.adult_confirmed))throw new Error('Finish your account details and consent before continuing.');
if(!member){if(!data.session.user.email_confirmed_at)throw new Error('Verify your registered email before completing account creation.');const setupPhone=normalize(data.session.user.user_metadata?.jtg_phone||'');if(setupPhone&&setupPhone!==phone)throw new Error('Enter the original phone number used to create this account.');ensureRegistrationDraft(data.session.user,phone);}
return {access_token:data.session.access_token,refresh_token:data.session.refresh_token,pending_setup:!member};
}catch(error){try{await client.auth.signOut({scope:'local'});}catch{}throw error;}
}
// Normal phone login uses the database connection, not the intermittently failing edge gateway.
// The resolver verifies the password before returning an email; Auth still issues every session.
function loginConnectionError(error){return error?.status>=500||['login_connection','PGRST000','PGRST001','PGRST002','PGRST003','PGRST202'].includes(error?.code)||/failed to send a request to the edge function|failed to fetch|fetch failed|network|timed out|temporarily unavailable|unable to connect|unexpected service response|connection interrupted|offline/i.test(error?.message||'');}
function loginProgress(label){if(authMode!=='login'||!authBusy)return;const button=document.getElementById('authForm')?.querySelector('button[type="submit"]');if(button)button.textContent=label;}
async function resolvePhoneLogin(phone,password){
for(let attempt=0;attempt<2;attempt++){
try{
const {data,error,status}=await publicCloud.rpc('jtg_login_identity',{p_phone:phone,p_password:password});
if(error)throw Object.assign(new Error(error.message||'Login connection is unavailable.'),{code:error.code||'',status:status||0});
if(data?.ok!==true){if(data?.error)throw Object.assign(new Error(data.error),{code:data.code||'invalid_credentials',status:data.code==='login_rate_limited'?429:401});throw Object.assign(new Error('Login connection is temporarily unavailable.'),{code:'login_connection',status:503});}
if(typeof data.email!=='string'||data.email.length>254||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email))throw Object.assign(new Error('Login connection is temporarily unavailable.'),{code:'login_connection',status:503});
return data;
}catch(error){
// Retry transport errors only. Wrong passwords, bans, and request limits are not retried.
if(attempt!==0||!loginConnectionError(error)||error?.code==='PGRST202'||navigator.onLine===false)throw error;
loginProgress('Reconnecting…');await new Promise(resolve=>setTimeout(resolve,900));
}
}
throw Object.assign(new Error('Login connection is temporarily unavailable.'),{code:'login_connection',status:503});
}
async function authenticateAccount(phone,password,enteredEmail=''){
const email=String(enteredEmail||'').trim();
if(email){loginProgress('Verifying password…');return loginWithEmail(phone,password,email);}
const saved=rememberedAccount?.phone===phone?rememberedAccount.email:'';
if(saved){try{loginProgress('Verifying password…');return await loginWithEmail(phone,password,saved);}catch(error){if(error?.code!=='invalid_credentials'&&!/invalid login credentials/i.test(error?.message||'')&&!loginConnectionError(error))throw error;}}
loginProgress('Checking registered account…');
let identity;
try{identity=await resolvePhoneLogin(phone,password);}
catch(error){
if(!loginConnectionError(error)||navigator.onLine===false)throw error;
// Keep the old service as a secondary route only when the database connection cannot be reached.
loginProgress('Trying alternate connection…');return invokeCloud('jtg-phone-login',{phone,password},{publicAccess:true});
}
loginProgress('Verifying password…');return loginWithEmail(phone,password,identity.email);
}

async function syncCloud(){

const task=(async()=>{try{
const {data,error}=await cloud.auth.getSession();if(generation!==authGeneration)return false;if(error)throw error;cloudSession=data.session;
if(!cloudSession){session=null;clearFinancialState();connectionNotice();renderAuth();return true;}

if(recoveryVerified){session=null;clearFinancialState();connectionNotice();authMode='reset-verify';if(!document.getElementById('authForm'))renderAuth();return true;}
const accountId=syncingId;
if(session&&session.id!==accountId){session=null;clearFinancialState();}
// Authorization comes from the signed-in identity, not a supplied phone, password, or client role flag.
const [membersResult,adminRole]=await Promise.all([cloud.from('jtg_member_accounts').select('*'),rpcCloud('jtg_is_admin')]);
if(generation!==authGeneration||cloudSession?.user?.id!==accountId)return false;
if(membersResult.error)throw membersResult.error;if(typeof adminRole!=='boolean')throw new Error('Account permissions could not be verified. Please retry.');
const rows=membersResult.data||[],own=rows.find(r=>r.user_id===accountId);
if(!own){
session=null;clearFinancialState();connectionNotice();
if(!['reset','reset-verify'].includes(authMode)){
if(cloudSession.user.email_confirmed_at){authMode='complete';ensureRegistrationDraft(cloudSession.user);}
else authMode=signupDraft?.type==='signup'?'verify':'signup';
}

}
if(own.banned){authGeneration++;session=null;clearFinancialState();connectionNotice();authMode='login';const {error:outError}=await cloud.auth.signOut({scope:'local'});if(outError)console.error('Unable to revoke the local banned session.');cloudSession=null;modal.close();renderAuth();toast('You have been banned contact admin');return true;}
const mapped=rows.map(mapMember),mine=mapped.find(u=>u.id===accountId);
const [snapshot,limits,parentName]=await Promise.all([rpcCloud('jtg_financial_snapshot'),adminRole?Promise.resolve(null):rpcCloud('jtg_withdrawal_limits'),own.referrer_id?rpcCloud('jtg_my_referrer_name'):Promise.resolve(null)]);
if(generation!==authGeneration||cloudSession?.user?.id!==accountId)return false;
if(own.referrer_id)mine.referrerName=parentName;
mapped.forEach(member=>{member.isAdmin=member.id===accountId&&adminRole===true;});
if(!adminRole&&(!limits||limits.minimumAmount!==minimumWithdrawal||limits.dailyLimit!==dailyWithdrawalLimit||!Number.isInteger(limits.submittedToday)||limits.submittedToday<0||!Number.isInteger(limits.remainingToday)||limits.remainingToday!==Math.max(0,dailyWithdrawalLimit-limits.submittedToday)))throw new Error('Withdrawal limits could not be loaded. Please retry.');
const before=JSON.stringify({db,wallets,withdrawalLimits}),newSession=!session||session.id!==accountId||session.admin!==adminRole;
applyFinancialSnapshot(snapshot,accountId);db.users=mapped;withdrawalLimits=limits;session={id:accountId,admin:adminRole};rememberAccount(mine,cloudSession.user);if(signupDraft?.email?.toLowerCase()===cloudSession.user.email?.toLowerCase()){signupDraft=null;storeDraft();}connectionNotice();
if(newSession){restoreRoute(location.hash.slice(1),adminRole);filter='All';history.replaceState(null,'',location.pathname+location.search+'#'+routeHash());}
if(newSession||before!==JSON.stringify({db,wallets,withdrawalLimits})||!app.children.length)render();return true;
}catch(error){
if(generation!==authGeneration)return false;
const message=cloudMessage(error);
if(['session_not_found','refresh_token_not_found','refresh_token_already_used','bad_jwt'].includes(error?.code)){authGeneration++;session=null;cloudSession=null;clearFinancialState();connectionNotice();modal.close();authMode='login';renderAuth();toast('Your session has expired. Log in again with your registered phone and password.');return false;}
if(cloudSession&&cloudSession.user.id===syncingId){connectionNotice(message);if(!session||session.id!==syncingId||!financialReady){session=null;clearFinancialState();renderConnectionError(message);}}
else{session=null;clearFinancialState();connectionNotice();authMode='login';renderAuth();toast(message);}
return false;
}})();
syncTask=task;try{return await task;}finally{if(syncTask===task)syncTask=null;}
}

async function handleAuth(e){
e.preventDefault();if(authBusy)return;const f=e.target,d=new FormData(f),mode=authMode,button=f.querySelector('button[type="submit"]'),error=document.getElementById('authError'),originalLabel=button.innerHTML;
const fail=m=>{const target=document.getElementById('authError');if(target){target.textContent=m;target.classList.remove('hidden');}else toast(m);};
authBusy=true;f.setAttribute('aria-busy','true');button.disabled=true;button.textContent=mode==='login'?'Logging in…':mode==='signup'||mode==='reset'?'Sending code…':'Saving account…';error.classList.add('hidden');
try{
if(mode==='login'){
const phone=normalize(d.get('phone'));if(!/^0[37]\d{8}$/.test(phone))throw new Error('Enter a valid Ugandan mobile number.');
const tokens=await authenticateAccount(phone,String(d.get('password')),d.get('email'));if(!tokens?.access_token||!tokens?.refresh_token)throw new Error('Login could not be completed. Please try again.');
if(syncTask)await syncTask;authGeneration++;session=null;clearFinancialState();connectionNotice();
const {data,error:loginError}=await cloud.auth.setSession({access_token:tokens.access_token,refresh_token:tokens.refresh_token});if(loginError)throw loginError;if(!data.session)throw new Error('Login could not be completed. Please try again.');
cloudSession=data.session;recoveryVerified=false;route='home';rememberLoginPhone(phone);if(!tokens.pending_setup){signupDraft=null;storeDraft();}
history.replaceState(null,'',location.pathname+location.search);if(await syncCloud()){if(session){modal.close();route=session.admin?'overview':'home';history.replaceState(null,'',location.pathname+location.search+'#'+(session.admin?'admin/overview':'home'));render();}}return;
}
if(mode==='reset'){
const email=String(d.get('email')).trim().toLowerCase();signupDraft={email,type:'reset',stage:'details'};storeDraft();await sendEmailCode(signupDraft);signupDraft.stage='verify';storeDraft();recoveryVerified=false;authMode='reset-verify';renderAuth();toast('Recovery code requested. Check your inbox and spam folder.');return;
}
if(mode==='reset-verify'){
if(d.get('password')!==d.get('confirm'))throw new Error('Your passwords do not match.');
if(!recoveryVerified){if(!signupDraft?.email)throw new Error('Request a recovery code again.');const {data,error:verifyError}=await cloud.auth.verifyOtp({email:signupDraft.email,token:String(d.get('otp')),type:'recovery'});if(verifyError)throw verifyError;if(!data.session)throw new Error('Recovery could not be verified. Please request a new code.');authGeneration++;cloudSession=data.session;recoveryVerified=true;session=null;clearFinancialState();connectionNotice();}
const {error:updateError}=await cloud.auth.updateUser({password:String(d.get('password'))});if(updateError)throw updateError;
const {error:outError}=await cloud.auth.signOut({scope:'local'});if(outError)throw outError;authGeneration++;cloudSession=null;session=null;clearFinancialState();connectionNotice();recoveryVerified=false;signupDraft=null;storeDraft();authMode='login';renderAuth();toast('Password updated. Log in with your phone and new password.');return;
}
if(mode==='signup'||mode==='complete'){
const phone=normalize(d.get('phone')),name=String(d.get('name')||'').trim(),referral=incomingReferral||String(d.get('referral')||'').trim().toUpperCase();
if(!/^0[37]\d{8}$/.test(phone))throw new Error('Enter a valid Ugandan mobile number.');if(!name||name.length>80)throw new Error('Enter your registered name, up to 80 characters.');if(!d.get('adult'))throw new Error('You must be 18 years or older.');if(referral)await resolveInvitation(referral);
const email=mode==='complete'?cloudSession?.user?.email:String(d.get('email')||'').trim().toLowerCase();if(!email)throw new Error('Start registration again to verify your email.');
if(mode==='signup'&&cloudSession){const {error:outError}=await cloud.auth.signOut({scope:'local'});if(outError)throw outError;authGeneration++;cloudSession=null;session=null;clearFinancialState();connectionNotice();}
signupDraft={phone,name,referral,adult:true,email,type:'signup',stage:mode==='complete'?'complete':'details'};storeDraft();rememberLoginPhone(phone);
if(mode==='signup'){await sendEmailCode(signupDraft);signupDraft.stage='verify';storeDraft();authMode='verify';renderAuth();toast('Verification code requested. Check your inbox and spam folder.');return;}
}
if(mode==='verify'||mode==='complete'){
if(d.get('password')!==d.get('confirm'))throw new Error('Your passwords do not match.');
if(mode==='verify'){
if(!signupDraft?.email)throw new Error('Start registration again to request an email code.');
const {data,error:verifyError}=await cloud.auth.verifyOtp({email:signupDraft.email,token:String(d.get('otp')),type:'email'});if(verifyError)throw verifyError;if(!data.session)throw new Error('Email verification could not be completed. Please request a new code.');
authGeneration++;cloudSession=data.session;signupDraft.stage='complete';storeDraft();authMode='complete';
}
if(!cloudSession?.user?.email_confirmed_at||cloudSession.user.email?.toLowerCase()!==signupDraft.email.toLowerCase())throw new Error('Verify your registered email before continuing.');
const {error:passwordError}=await cloud.auth.updateUser({password:String(d.get('password')),data:{username:signupDraft.name,jtg_phone:signupDraft.phone,jtg_referral:signupDraft.referral||'',jtg_adult:signupDraft.adult===true}});
// Retrying account setup with the password already saved must not block consent.
// This is accepted only inside this verified user's registration flow, never at login.
if(passwordError&&passwordError.code!=='same_password'&&!/new password should be different from the old password/i.test(passwordError.message||''))throw passwordError;
// Capture registration details so a retry or dismissed dialog cannot attribute another draft's referral.
const registration={...signupDraft},newUser={phone:registration.phone,name:registration.name};authMode='complete';renderAuth();
consentPopup(newUser,async()=>{
if(authBusy)throw new Error('Please wait for the current account request to finish.');authBusy=true;
try{
await rpcCloud('jtg_register_member',{p_phone:registration.phone,p_name:registration.name,p_referral_code:registration.referral||null,p_consent_text:consentText});
rememberLoginPhone(newUser.phone);signupDraft=null;storeDraft();incomingReferral='';inviterName='';try{localStorage.removeItem(REFERRAL_KEY);}catch{}
const clean=new URL(location.href);clean.searchParams.delete('ref');clean.hash='home';history.replaceState(null,'',clean);modal.close();route='home';
if(await syncCloud()){if(session){render();toast('Account created. Use your registered phone number and password to log in next time.');}}
}finally{authBusy=false;}
});return;
}
}catch(err){if(mode==='login'&&loginConnectionError(err)){const help=f.querySelector('[data-login-help]');if(help)help.open=true;}if(mode==='verify'&&authMode==='complete'&&cloudSession)renderAuth();if(mode==='reset-verify'&&recoveryVerified)renderAuth();fail(cloudMessage(err));}
finally{authBusy=false;f.removeAttribute('aria-busy');if(button.isConnected){button.disabled=false;button.innerHTML=originalLabel;}updateOtpControls();}
}

// Keep all three review actions visible on every request; completed decisions cannot be repeated.
function requestActions(record,kind){
const pending=record.status==='Pending',approved=record.status==='Approved',member=getUser(record.userId),name=member?.name||'this member',type=kind==='payments'?'payment':'withdrawal',attribute=kind==='payments'?'data-payment':'data-withdraw';
const canApprove=pending&&!member?.banned;
return `<div role="group" aria-label="${esc(type+' request actions for '+name)}" class="mt-5 grid grid-cols-3 gap-2 border-t border-slate-200 pt-5"><button type="button" ${attribute}="${esc(record.id)}" data-decision="Approved" ${canApprove?'':'disabled'} aria-label="${esc('Approve '+type+' request for '+name)}" title="${pending?(member?.banned?'Unban this member before approval':'Approve this request'):'This request has already been reviewed'}" class="inline-flex min-h-11 min-w-0 items-center justify-center gap-1.5 rounded-lg bg-[#16A34A] px-2 py-3 text-xs font-bold text-white hover:bg-[#15803D] sm:gap-2 sm:px-3 sm:text-sm">${icon('check')} Approve</button><button type="button" ${attribute}="${esc(record.id)}" data-decision="Rejected" ${pending?'':'disabled'} aria-label="${esc('Reject '+type+' request for '+name)}" title="${pending?'Reject this request':'This request has already been reviewed'}" class="inline-flex min-h-11 min-w-0 items-center justify-center gap-1.5 rounded-lg bg-[#DC2626] px-2 py-3 text-xs font-bold text-white hover:bg-[#B91C1C] sm:gap-2 sm:px-3 sm:text-sm">${icon('xmark')} Reject</button><button type="button" data-delete="${esc(record.id)}" data-kind="${kind}" ${approved?'disabled':''} aria-label="${esc('Delete '+type+' request from review for '+name)}" title="${approved?'Approved records are retained to protect account balances':'Remove from review; keep the audit record'}" class="inline-flex min-h-11 min-w-0 items-center justify-center gap-1.5 rounded-lg border border-slate-300 bg-slate-100 px-2 py-3 text-xs font-bold text-white hover:bg-slate-700 sm:gap-2 sm:px-3 sm:text-sm">${icon('trash')} Delete</button></div><p class="mt-3 text-[11px] leading-relaxed text-muted">${approved?(type==='payment'?'Payment approved and product activated.':'Withdrawal approved and balance deducted once.')+' Approved records cannot be deleted or reviewed again.':pending?'Each action requires confirmation. Delete removes this request from review while retaining its audit record.':'Request rejected. Approve and Reject are disabled; Delete removes it from review while retaining its audit record.'}</p>`;
}
function paymentCard(p){const u=getUser(p.userId),pack=packages[p.packageId];return `<article class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-6"><div class="mb-5 flex items-center justify-between"><div><h2 class="font-display text-base font-bold">${esc(u?.name||'Unknown member')}</h2><p class="mt-1 text-xs text-slate-500">${esc(u?.phone)}</p></div>${pill(p.status)}</div><div class="mb-5 flex items-center justify-between rounded-xl bg-slate-50 p-4"><span class="text-xs text-slate-500">${pack.name} package</span><strong class="font-display">UGX ${money(p.price)}</strong></div><dl class="space-y-3 text-xs"><div class="flex justify-between"><dt class="text-slate-500">Network</dt><dd class="font-semibold">${esc(p.network)}</dd></div><div class="flex justify-between"><dt class="text-slate-500">Sent from phone</dt><dd>${esc(p.sender)}</dd></div><div class="flex justify-between"><dt class="text-slate-500">Submitted</dt><dd>${date(p.submitted)}</dd></div></dl>${adminReferralDetails(u)}<details class="mt-4 rounded-lg border border-slate-200 text-xs"><summary class="cursor-pointer p-3 font-semibold">Proof / payment reference</summary><p class="break-all border-t border-slate-100 p-3 leading-relaxed text-slate-500">${esc(p.proof)}</p></details>${requestActions(p,'payments')}</article>`;}
function withdrawCard(w){const u=getUser(w.userId);return `<article class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-6"><div class="mb-5 flex justify-between gap-3"><div><h2 class="font-display text-base font-bold">${esc(u?.name||'Unknown member')}</h2><p class="mt-1 text-xs text-slate-500">${esc(u?.phone)}</p></div>${pill(w.status)}</div><dl class="space-y-3 text-xs"><div class="flex justify-between"><dt class="text-slate-500">Joined date</dt><dd>${u?date(u.joined):'—'}</dd></div><div class="flex justify-between"><dt class="text-slate-500">Total earned</dt><dd class="font-bold">UGX ${money(totalEarned(w.userId))}</dd></div><div class="flex justify-between"><dt class="text-slate-500">Earned account balance</dt><dd class="font-bold text-blue">UGX ${money(accountBalance(w.userId))}</dd></div><div class="flex justify-between"><dt class="text-slate-500">Available to request</dt><dd class="font-bold">UGX ${money(balance(w.userId))}</dd></div><div class="flex justify-between"><dt class="text-slate-500">Pending reservations</dt><dd>UGX ${money(pendingWithdrawals(w.userId))}</dd></div><div class="flex justify-between"><dt class="text-slate-500">Approved deductions</dt><dd>UGX ${money(approvedWithdrawn(w.userId))}</dd></div><div class="flex justify-between"><dt class="text-slate-500">Referral code</dt><dd class="max-w-[65%] break-all text-right">${esc(u?.referralCode||'—')}</dd></div><div class="flex flex-wrap justify-between gap-1"><dt class="text-slate-500">User ID</dt><dd class="break-all text-[10px]">${esc(w.userId)}</dd></div></dl>${adminReferralDetails(u)}${paymentAccountDetails(u)}${taxBoxes(w)}<div class="rounded-lg bg-slate-50 p-3 text-xs"><strong>Send via ${esc(w.network)} · ${esc(w.phone)}</strong><p class="mt-1 text-slate-500">${esc(w.name)} · Net only: UGX ${money(w.net)}</p></div><p class="mt-4 rounded-lg border border-slate-200 p-3 text-xs leading-relaxed ${w.status==='Approved'?'text-emerald-800':'text-slate-500'}">${w.status==='Approved'?`Approved: UGX ${money(w.amount)} deducted once from this member’s account.`:w.status==='Rejected'?'Rejected: reservation released; no deduction.':`Approval will deduct UGX ${money(w.amount)} once, including tax. Pay the member UGX ${money(w.net)} only.`}</p><p class="mt-4 text-[11px] text-slate-500">Submitted ${date(w.submitted)}</p>${w.reviewed?`<p class="mt-2 text-[11px] text-slate-500">${w.status} ${date(w.reviewed)}</p>`:''}${requestActions(w,'withdrawals')}</article>`;}
function navigate(r){if(!guard()){toast('Reconnect to load your verified dashboard.');render();return;}const allowed=session.admin?adminNav:navItems;if(!allowed.some(n=>n[0]===r)){toast('This page is not available for your account.');r=session.admin?'overview':'home';}selectedPackageId=null;route=r;filter='All';location.hash=routeHash();render();window.scrollTo({top:0,behavior:'instant'});}
// Remove a successfully reviewed request from the pending queue immediately.
// The server retains members, approved financial records, and archived audit records.
async function reviewRequest(kind,id,decision){
if(!['payments','withdrawals'].includes(kind)||!['Approved','Rejected','Delete'].includes(decision))throw new Error('Invalid review action.');
if(decision==='Delete'){
await rpcCloud('jtg_archive_request',{p_id:id,p_kind:kind});
db[kind]=db[kind].filter(record=>record.id!==id);
}else{
await rpcCloud(kind==='payments'?'jtg_decide_payment':'jtg_decide_withdrawal',{p_id:id,p_decision:decision});
const record=db[kind].find(record=>record.id===id);if(record){record.status=decision;record.reviewed=now();}
}
}
function confirmAction(title,text,callback,success='Changes saved.',label='Confirm'){
const color=label==='Approve'?'bg-[#16A34A] hover:bg-[#15803D]':label==='Reject'||label==='Delete'?'bg-[#DC2626] hover:bg-[#B91C1C]':'bg-blue hover:bg-blue-700';
showModal(`${modalTitle(title)}<div class="p-6"><p class="text-sm leading-relaxed text-slate-500">${text}</p><p id="confirmError" role="alert" class="mt-4 hidden rounded-lg border border-red-100 bg-red-50 p-3 text-sm text-red-700"></p><div class="mt-6 flex justify-end gap-3">${btn('Cancel','close-modal','border border-slate-200 text-slate-600 hover:bg-slate-50')}<button type="button" id="confirmAction" class="min-h-11 rounded-lg ${color} px-5 text-sm font-semibold text-white">${esc(label)}</button></div></div>`);
const confirm=document.getElementById('confirmAction'),errorText=document.getElementById('confirmError');
confirm.addEventListener('click',async()=>{if(confirm.disabled)return;if(!session?.admin||!guard()){errorText.textContent='Reconnect to verify your administrator session before continuing.';errorText.classList.remove('hidden');return;}confirm.disabled=true;confirm.textContent='Saving…';modal.dataset.busy='true';modal.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.disabled=true);errorText.classList.add('hidden');try{if(syncTask)await syncTask;if(!session?.admin||!guard())throw new Error('Reconnect to verify your administrator session before continuing.');await callback();delete modal.dataset.busy;modal.close();render();const refreshed=await syncCloud();render();toast(refreshed?success:success+' Reconnect to load the latest records.');}catch(error){const message=cloudMessage(error);if(errorText.isConnected){errorText.textContent=message;errorText.classList.remove('hidden');}else toast(message);if(confirm.isConnected){confirm.disabled=false;confirm.textContent=label;}}finally{delete modal.dataset.busy;modal.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.disabled=false);}});
}
function dailyCheck(){const u=current();if(!u)return;const ps=userProducts(u.id).filter(p=>state(p)==='Active');showModal(`${modalTitle('Daily Check','Automatic credits. No manual claiming.')}<div class="p-6"><div class="mb-5 rounded-xl bg-blue-50 p-5"><p class="text-xs text-blue">Daily scheduled earnings · active products</p><p class="mt-2 font-display text-2xl font-bold text-blue">UGX ${money(ps.reduce((s,p)=>s+p.daily,0))}</p></div>${ps.length?ps.map(p=>`<div class="flex items-center justify-between border-b border-slate-100 py-4 text-sm"><div><strong>${packages[p.packageId].name}</strong><p class="mt-1 text-xs text-slate-500">Day ${days(p)}/${duration(p)} · Next credit</p></div><strong data-countdown="${p.id}" class="font-mono text-blue">—</strong></div>`).join(''):'<p class="py-4 text-sm text-slate-500">No active products yet. Approval starts your 24-hour earning cycle.</p>'}<p class="mt-5 text-xs leading-relaxed text-slate-500">Credits are calculated by the server from approval time for each completed 24-hour period. They stop after day 15 for Vitz and Passo and day 60 for all other packages. Today’s earnings show a completed credit dated today. The scheduled daily amount above is not a manual claim.</p></div>`);updateCountdown();}
function showRules(){showModal(`${modalTitle('Platform Rules','Read before submitting any request')}<div class="space-y-4 p-6 text-sm leading-relaxed text-slate-600"><p><strong class="text-ink">1. Adults only.</strong> You must be 18 or older and give voluntary consent.</p><p><strong class="text-ink">2. Payment approval.</strong> Requests remain Pending until approved. Approval time is activation time.</p><p><strong class="text-ink">3. Earnings cycle.</strong> Every completed 24-hour period adds the package’s daily earnings. No manual claim. Vitz (UGX 15,000) and Passo (UGX 30,000) expire after 15 days. All other packages retain their 60-day expiry.</p><p><strong class="text-ink">4. Withdrawals.</strong> The minimum requested amount is UGX 7,000. Each member may submit only two withdrawal requests per day, resetting at midnight Uganda time (EAT). All submitted requests count toward the daily limit, including rejected or removed requests. Pending requested amounts are reserved. Approval deducts the full requested amount once from your earned account balance. Tax is 18% of the requested amount; net pay is requested minus tax. You receive net only. Rejection releases the reservation without an account deduction. UGX tax amounts are rounded to whole shillings.</p><p><strong class="text-ink">5. Referrals.</strong> Only referral relationships are displayed. No referral earnings are calculated.</p><p><strong class="text-ink">6. Account restrictions.</strong> Banned users cannot log in, invest, or withdraw. Contact the administrator if banned.</p></div>`);}

// All mutations are authorized, validated, and serialized in database RPCs.
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.hasAttribute('data-password-toggle')){const input=b.closest('[data-password-field]')?.querySelector('input');if(!input)return;const showing=input.type==='password';input.type=showing?'text':'password';b.setAttribute('aria-pressed',String(showing));b.setAttribute('aria-label',(showing?'Hide ':'Show ')+(input.name==='confirm'?'confirm password':'password'));b.innerHTML=icon(showing?'eye-slash':'eye');return;}
if(b.dataset.route)return navigate(b.dataset.route);
if(b.dataset.productFilter){productFilter=b.dataset.productFilter;render();return;}
if(b.dataset.filter){filter=b.dataset.filter;render();return;}
if(b.dataset.invest!==undefined){if(guard()&&!session.admin)openPaymentPage(Number(b.dataset.invest));else{toast('Reconnect to open your verified member dashboard.');render();}return;}
if(b.dataset.ban&&session?.admin&&guard()){const u=getUser(b.dataset.ban);if(!u)return;if(u.id===session.id)return toast('You cannot ban your own administrator account.');confirmAction(u.banned?'Unban member':'Ban member',`${u.banned?'Restore access for':'Block login, investments, and withdrawals for'} ${esc(u.name)}?`,async()=>{const {data,error}=await cloud.from('jtg_member_accounts').update({banned:!u.banned}).eq('user_id',u.id).select('user_id');if(error)throw error;if(!data?.length)throw new Error('Member could not be updated. Please refresh.');},u.banned?'Member access restored.':'Member banned.');return;}
if(b.dataset.payment&&session?.admin&&guard()){const p=db.payments.find(p=>p.id===b.dataset.payment);if(!p||p.status!=='Pending')return;const decision=b.dataset.decision;if(getUser(p.userId)?.banned&&decision==='Approved')return toast('Unban this member before approving their payment.');if(!['Approved','Rejected'].includes(decision))return;const details=`<strong class="text-white">${esc(getUser(p.userId)?.name||'Unknown member')}</strong> · ${esc(packages[p.packageId].name)} · UGX ${money(p.price)}<br>Sent via ${esc(p.network)} from ${esc(p.sender)}.<br><br>`;confirmAction(decision==='Approved'?'Approve payment & activate':'Reject payment',details+(decision==='Approved'?'Confirm you have received this payment before approving. Approval starts this package’s '+packages[p.packageId].durationDays+'-day product cycle now.':'Reject this request without activating a product?'),()=>reviewRequest('payments',p.id,decision),decision==='Approved'?'Payment approved. Product activated.':'Payment rejected.',decision==='Approved'?'Approve':'Reject');return;}
if(b.dataset.withdraw&&session?.admin&&guard()){const w=db.withdrawals.find(w=>w.id===b.dataset.withdraw);if(!w||w.status!=='Pending')return;const decision=b.dataset.decision;if(getUser(w.userId)?.banned&&decision==='Approved')return toast('Unban this member before approving their withdrawal.');if(!['Approved','Rejected'].includes(decision))return;const details=`<strong class="text-white">${esc(getUser(w.userId)?.name||'Unknown member')}</strong> · Requested UGX ${money(w.amount)}<br>Recipient: ${esc(w.name)} · ${esc(w.network)} · ${esc(w.phone)}<br><br>`;confirmAction(decision==='Approved'?'Approve withdrawal & deduct balance':'Reject withdrawal',details+(decision==='Approved'?`Confirm the net payout of <strong class="text-white">UGX ${money(w.net)}</strong> has been sent via ${esc(w.network)} to ${esc(w.phone)}. Requested: UGX ${money(w.amount)}. Tax (${w.taxPercent}%): UGX ${money(w.tax)}. Approval deducts <strong class="text-white">UGX ${money(w.amount)}</strong> from the member’s earned account balance exactly once.`:'Reject this withdrawal and release the reserved amount? The member’s earned account balance will not be deducted.'),()=>reviewRequest('withdrawals',w.id,decision),decision==='Approved'?`Withdrawal approved. UGX ${money(w.amount)} deducted once; net pay UGX ${money(w.net)}.`:'Withdrawal rejected. Reservation released; no account deduction.',decision==='Approved'?'Approve':'Reject');return;}
if(b.dataset.delete&&session?.admin&&guard()){const kind=b.dataset.kind;if(!['payments','withdrawals'].includes(kind))return;const record=db[kind].find(x=>x.id===b.dataset.delete);if(!record)return;if(record.status==='Approved')return toast('Approved financial records are retained for balance integrity.');const type=kind==='payments'?'payment':'withdrawal',member=getUser(record.userId);confirmAction('Delete '+type+' request',`Remove the ${esc(type)} request for <strong class="text-white">${esc(member?.name||'Unknown member')}</strong> (${esc(member?.phone||'—')}) from review?<br><br>Amount: UGX ${money(kind==='payments'?record.price:record.amount)} · Status: ${esc(record.status)}.<br><br>This removes only the request from the review list, not the member’s account. Its financial audit record is retained.${kind==='withdrawals'&&record.status==='Pending'?' The pending reservation will be released; the earned account balance will not be deducted.':''}`,()=>reviewRequest(kind,record.id,'Delete'),'Request deleted from review. Audit record retained.','Delete');return;}
const a=b.dataset.action;if(!a)return;
if(a==='close-modal'){if(modal.dataset.busy!=='true')modal.close();return;}
if(a==='back-packages'){navigate('invest');return;}
if(a.startsWith('auth-')){if(authBusy)return;const next=a.slice(5);if(!['landing','login','signup','reset'].includes(next))return;if(next==='signup'&&document.getElementById('authForm')?.elements.email&&signupDraft?.type==='signup'){signupDraft.email=document.getElementById('authForm').elements.email.value.trim().toLowerCase();storeDraft();}if(recoveryVerified){authBusy=true;b.disabled=true;try{const {error}=await cloud.auth.signOut({scope:'local'});if(error)throw error;authGeneration++;cloudSession=null;session=null;clearFinancialState();connectionNotice();recoveryVerified=false;}catch(error){toast(cloudMessage(error));return;}finally{authBusy=false;if(b.isConnected)b.disabled=false;}}if(signupDraft?.type==='reset'&&next!=='reset'){signupDraft=null;storeDraft();}authMode=next;renderAuth();return;}
if(a==='resend-otp'){if(authBusy||!signupDraft?.email)return;authBusy=true;b.disabled=true;try{await sendEmailCode(signupDraft);signupDraft.stage='verify';storeDraft();const otp=document.getElementById('authForm')?.elements.otp;if(otp)otp.value='';toast('New code requested. Check your inbox and spam folder; use the newest email.');}catch(error){toast(cloudMessage(error));}finally{authBusy=false;updateOtpControls();}return;}
if(a==='logout'){if(authBusy)return;authBusy=true;b.disabled=true;try{const {error}=await cloud.auth.signOut({scope:'local'});if(error)throw error;authGeneration++;session=null;cloudSession=null;clearFinancialState();connectionNotice();recoveryVerified=false;signupDraft=null;storeDraft();route='home';authMode='login';history.replaceState(null,'',location.pathname+location.search);modal.close();renderAuth();}catch(error){toast(cloudMessage(error));}finally{authBusy=false;if(b.isConnected)b.disabled=false;}return;}
if(a==='refresh'||a==='run-income'){if(a==='run-income'&&(!guard()||!session.admin))return;b.disabled=true;try{if(await syncCloud()){render();updateCountdown();toast(a==='run-income'?'Income refreshed. Completed cycles counted once; each package’s 15- or 60-day cap applied.':'Balances and requests refreshed.');}else toast(connectionIssue||'Unable to refresh. Check your connection and try again.');}finally{if(b.isConnected)b.disabled=false;}return;}
if(!guard()||session.admin)return;
if(a==='about-us')return aboutUs();
if(a==='earnings-guide')return earningsGuide();
if(a==='copy-referral')return copyReferral();
if(a==='share-referral')return shareReferral();
if(a==='daily-check')return dailyCheck();
if(a==='rules')return showRules();
});
function applyHash(){const h=location.hash.slice(1);if(!guard()){if(!modal.open)render();return;}if(h.startsWith('admin/')&&!session.admin){toast('Admin access is restricted.');restoreRoute('home',false);history.replaceState(null,'',location.pathname+location.search+'#home');}else restoreRoute(h,session.admin);render();}
window.addEventListener('hashchange',applyHash);
setInterval(()=>{updateCountdown();updateOtpControls();},1000);
// Shared approvals and balances are polled; browser storage never supplies financial records.
const mayRefresh=()=>cloudSession&&!authBusy&&!modal.open&&!recoveryVerified&&(session||connectionIssue);
setInterval(()=>{if(mayRefresh()&&document.visibilityState==='visible')syncCloud();},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mayRefresh())syncCloud();});
window.addEventListener('online',()=>{if(mayRefresh())syncCloud();});
window.addEventListener('offline',()=>{if(session)connectionNotice('You are offline. Reconnect to load the latest records.');});
// Queued events from an older sign-out must not clear a newer administrator sign-in.
cloud.auth.onAuthStateChange((event,active)=>{if(event==='INITIAL_SESSION')return;const eventGeneration=authGeneration;setTimeout(async()=>{
if(authBusy||eventGeneration!==authGeneration)return;
try{
if(event==='PASSWORD_RECOVERY'&&active){authGeneration++;cloudSession=active;recoveryVerified=true;session=null;clearFinancialState();connectionNotice();modal.close();authMode='reset-verify';signupDraft={email:active.user.email,type:'reset'};storeDraft();renderAuth();return;}
if(event==='SIGNED_OUT'){
const {data,error}=await cloud.auth.getSession();if(eventGeneration!==authGeneration||authBusy)return;if(error)throw error;
if(data.session){cloudSession=data.session;if(!modal.open&&!recoveryVerified)await syncCloud();return;}
authGeneration++;session=null;cloudSession=null;clearFinancialState();connectionNotice();recoveryVerified=false;modal.close();authMode='login';history.replaceState(null,'',location.pathname+location.search);renderAuth();return;
}
if(['SIGNED_IN','TOKEN_REFRESHED','USER_UPDATED'].includes(event)){
const {data,error}=await cloud.auth.getSession();if(eventGeneration!==authGeneration||authBusy)return;if(error)throw error;
if(!data.session||active&&data.session.user.id!==active.user.id)return;cloudSession=data.session;
if(modal.open||recoveryVerified)return;if(event==='TOKEN_REFRESHED'&&!session&&!connectionIssue)return;await syncCloud();
}
}catch(error){const message=cloudMessage(error);if(cloudSession){connectionNotice(message);if(!session||!financialReady)renderConnectionError(message);}else toast(message);}
},0);});
async function initialize(){app.innerHTML=`<main class="m-0 flex min-h-screen w-full items-center justify-center bg-ink"><div role="status" class="text-center"><span class="mb-4 inline-flex h-12 w-12 items-center justify-center rounded-xl bg-blue-50 text-blue">${icon('shield-halved')}</span><p class="text-sm font-semibold">Checking your account…</p></div></main>`;if(incomingReferral){authMode='signup';try{const invitation=await resolveInvitation(incomingReferral);inviterName=invitation.name;}catch(error){toast(cloudMessage(error));}}else if(signupDraft?.type==='signup')authMode=signupDraft.stage==='details'?'signup':'verify';else if(signupDraft?.type==='reset')authMode=signupDraft.stage==='details'?'reset':'reset-verify';const params=new URLSearchParams(location.search);if(params.get('error')==='access_denied'){toast('Login was cancelled. Please try again.');params.delete('error');params.delete('error_description');history.replaceState(null,'',location.pathname+(params.toString()?'?'+params.toString():'')+location.hash);}await syncCloud();applyHash();}
initialize();
});
